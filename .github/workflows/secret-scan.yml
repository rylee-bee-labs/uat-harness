name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@2766ce473a3604cc8d80198c082c14a9b8f89102
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
