name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@dd3786719f03855fe527b6f64b152d30af4c02d4
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
