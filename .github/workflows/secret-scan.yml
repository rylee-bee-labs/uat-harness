name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@1ef597fa5c01af33353af4335e161c3e383f4013
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
