name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@01d703ed32abe4552db446f79d7228d86be2785e
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
